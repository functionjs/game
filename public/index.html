<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Your Friend! - Bot Championship</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <center>
    <header>
    
        <h1>🪙 Save Your Friend!</h1>
        <img id="logo" src="https://hackmd.io/_uploads/BJ1MQ3kJGl.png" alt="Arena Logo" title="Hover me 3 times to start the demo">
        <p id="status-text">Connecting to server...</p>
        <p id="deadline-timer" class="deadline-timer">Tournament starts in 15:00</p>
    </header>

    <main id="registration-view">

        <section class="card">

            <h2>Register Your Avatar-Bot</h2>

            <div class="input-group">
                <input type="email" id="email" placeholder="Your Google Email" required>
                 <input type="text" id="avatar-name" placeholder="Your Avatar-Bot Name" required>
            </div>

             <br>

             <label id="invitation-label" for="bot-code">Write your Bot JS logic as function play() here:</label>
            <textarea id="bot-code" spellcheck="false">
// piles:     array of integers  (coins) representing the current state of the game
// forbidden: array of forbidden moves
// context:   { mode: CONFIG.mode, timeRemaining: player.timeBank } 
//                    CONFIG.mode can be "NORMAL" or "GIVEAWAY" (see rules for details)
//OUTPUTS: Return an object { pileIndex: target, count: N };
//For example { pileIndex: 0, count: 1 } represents Bot's  want to take 1 coin from pile 0 

function play(piles, forbidden, context) {
                                         // TO DO 
                                         const target = piles.findIndex(p => p > 0);
                                          if(piles[target]== 1) N = 1;
                                          else                  N = 2;
                                           return { pileIndex: target, count: N }; 
}
            </textarea>
            <button id="btn-register" onclick="register()">Enter Championship</button>

        </section>

    </main>
  </center>

    <hr>

    <main id="dashboard-view" class="hidden">
        <div class="game-container">
            <section class="arena card">
                <h2>Live Battle</h2>
                <div id="player-names">
                    <span id="p1-label">Waiting...</span> vs <span id="p2-label">Waiting...</span>
                </div>
                <div id="current-fight" class="current-fight">Waiting for current fight...</div>
                <div id="piles-display">
                    </div>
                <div id="game-log"></div>
            </section>

            <aside class="leaderboard card">
                <h2>Leaderboard</h2>
                <div id="player-list" class="player-list">Contestants will appear here</div>
                <table id="score-table">
                    <thead>
                        <tr><th>Player</th><th>Score</th><th>Bank</th></tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
                <div id="match-matrix-container" class="matrix-container">
                    <table id="match-matrix"></table>
                </div>
            </aside>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
